{% extends "template.html" %}

{% block titulo %}
Relatórios
{% endblock %}

{% block conteudo %}

<h1>Relatório</h1>

<div style="width: 500px; max-width: 100%; height: 250px; margin-bottom: 30px;">
    <canvas id="graficoCategorias"></canvas>
</div>

<div style="width: 350px; max-width: 100%; height: 250px;">
    <canvas id="graficoStatus"></canvas>
</div>

{{ categorias_labels|json_script:"categorias" }}
{{ categorias_valores|json_script:"quantidades" }}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const categorias = JSON.parse(
        document.getElementById('categorias').textContent
    );

    const quantidades = JSON.parse(
        document.getElementById('quantidades').textContent
    );

    new Chart(document.getElementById('graficoCategorias'), {
        type: 'bar',
        data: {
            labels: categorias,
            datasets: [{
                label: 'Serviços por categoria',
                data: quantidades,
                backgroundColor: '#234B35'
            }]
        }
    });

    new Chart(document.getElementById('graficoStatus'), {
        type: 'doughnut',
        data: {
            labels: ['Ativos', 'Inativos'],
            datasets: [{
                data: [
                    {{ servicos_ativos }},
                    {{ servicos_inativos }}
                ],
                backgroundColor: [
                    '#234B35',
                    '#542C72',
                ]
            }]
        }
    });
</script>


{% endblock %}
