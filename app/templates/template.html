{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=6b917b">
</head>

<body>

    <header>
        <div class="logo"><img src="/media/servicos/mind_palace_logo.png" alt="Mind Palace Logo" style="width:40px;height:40px;object-fit:contain;background:transparent;"></div>
        <h1> <a href="{% url 'index' %}">Django</a> </h1>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <span style="margin:0 10px;">|</span>
                <a href="{% url 'logout' %}">Sair</a>
            {% else %}
                <a href="{% url 'quem_somos' %}">Quem somos</a>
                <a href="{% url 'produtos' %}">Produtos</a>
                <a href="{% url 'servico' %}">Serviços</a>
                <a href="{% url 'contato' %}">Contato</a>
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block conteudo %}
        {% endblock %}
    </main>

    <script>
        function toggleCards() {
            const cardsSection = document.getElementById('cardsSection');
            const tableSection = document.getElementById('tableSection');
            const btnToggle = document.getElementById('btnToggle');
            const isCardsVisible = cardsSection.style.display === 'block';
            
            if (isCardsVisible) {
                // Mostra tabela, esconde cards
                cardsSection.style.display = 'none';
                tableSection.style.display = 'block';
                btnToggle.textContent = 'Tabela';
                btnToggle.classList.remove('ativo');
            } else {
                // Mostra cards, esconde tabela
                cardsSection.style.display = 'block';
                tableSection.style.display = 'none';
                btnToggle.textContent = 'Lista';
                btnToggle.classList.add('ativo');
            }
        }
        
        // Inicializa como Lista (tabela visível)
        document.addEventListener('DOMContentLoaded', function() {
            const btnToggle = document.getElementById('btnToggle');
            const cardsSection = document.getElementById('cardsSection');
            const tableSection = document.getElementById('tableSection');
            if (btnToggle) {
                btnToggle.textContent = 'Tabela';
            }
            if (cardsSection) cardsSection.style.display = 'none';
            if (tableSection) tableSection.style.display = 'block';
        });
    </script>
</body>
</html>
