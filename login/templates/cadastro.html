{% extends 'template.html' %}

{% block titulo %}
Criar Conta
{% endblock %}

{% block conteudo %}

<div class="form-container" style="max-width:520px;">
    <h2>Criar Conta</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn-submit">Cadastrar</button>
            <a href="{% url 'login' %}" class="btn-back">Voltar</a>
        </div>
    </form>
</div>

{% endblock %}
