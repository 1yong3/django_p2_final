{% extends 'template.html' %}

{% block titulo %}
Editar Perfil
{% endblock %}

{% block conteudo %}

<div class="form-container">
    <h2>Editar Perfil</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Nome</label>
            <input type="text" name="nome" value="{{ user.first_name }}">
        </div>

        <div class="form-group">
            <label>Sobrenome</label>
            <input type="text" name="sobrenome" value="{{ user.last_name }}">
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email" name="email" value="{{ user.email }}">
        </div>

        <div class="form-group">
            <label>Nome de usuário</label>
            <input type="text" value="{{ user.username }}" disabled>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">Salvar Alterações</button>
            <a href="{% url 'dashboard' %}" class="btn-back">Voltar</a>
        </div>
    </form>

    <p style="text-align:center;margin-top:20px;">
        <a href="{% url 'alterar_senha' %}" style="color:#5a4761;font-weight:600;">
            Alterar Senha
        </a>
    </p>
</div>

{% endblock %}
