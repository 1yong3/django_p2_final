{% extends "template.html" %}

{% block titulo %}
Recuperar Senha
{% endblock %}

{% block conteudo %}

<h2>Esqueceu a Senha</h2>

<p>Digite seu e-mail para receber um link de redefinição de senha.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enviar e-mail</button>
</form>

{% endblock %}
