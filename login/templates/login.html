{% extends 'template.html' %}

{% block titulo %}
Login
{% endblock %}

{% block conteudo %}
    <h2> Login </h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" value="Entrar">Entrar</button>
        {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
    </form>

    <p> <a href="{% url 'cadastro' %}">Não tem uma conta? Cadastre-se</a></p>

{% endblock %}
