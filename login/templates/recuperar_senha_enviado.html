{% extends 'template.html' %}

{% block titulo %}
E-mail enviado
{% endblock %}

{% block conteudo %}

<div style="max-width:600px;margin:40px auto;padding:0 20px;text-align:center;">
    <h2 style="color:#6b917b;margin-bottom:15px;">Verifique seu e-mail</h2>

    <p style="color:#555;line-height:1.7;">
        Se existir uma conta com o e-mail informado, enviamos um link para
        redefinição de senha. Confira também a caixa de spam.
    </p>

    <p style="margin-top:25px;">
        <a href="{% url 'login' %}" class="btn-back" style="text-decoration:none;">Voltar ao login</a>
    </p>
</div>

{% endblock %}
