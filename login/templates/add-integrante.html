{% extends 'template.html' %}

{% block titulo %}
Novo Integrante
{% endblock %}

{% block conteudo %}

<div class="form-container">
    <h2>Novo Integrante</h2>

    <form method="post" action="{% url 'addIntegrante' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" required>
        </div>

        <div class="form-group">
            <label for="cargo">Cargo</label>
            <input type="text" name="cargo" id="cargo" required>
        </div>

        <div class="form-group">
            <label for="biografia">Biografia</label>
            <textarea name="biografia" id="biografia" required></textarea>
        </div>

        <div class="form-group">
            <label for="foto">Foto (URL ou caminho)</label>
            <input type="text" name="foto" id="foto" placeholder="/media/servicos/ic_quemsomos1.png">
        </div>

        <div class="form-group">
            <label for="ordem">Ordem de exibição</label>
            <input type="number" name="ordem" id="ordem" value="0" min="0">
            <small style="color:#888;">Menor número aparece primeiro. Use 2 para o Criador ficar no centro.</small>
        </div>

        <div class="form-group form-check">
            <input type="checkbox" name="ativo" id="ativo" checked>
            <label for="ativo" style="margin:0;">Ativo (aparece no site)</label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">Cadastrar</button>
            <a href="{% url 'integrantes' %}" class="btn-back">Voltar</a>
        </div>
    </form>
</div>

{% endblock %}
