{% extends 'template.html' %}

{% block titulo %}
Alterar Senha
{% endblock %}

{% block conteudo %}

<div class="form-container" style="max-width:520px;">
    <h2>Alterar Senha</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn-submit">Alterar Senha</button>
            <a href="{% url 'perfil' %}" class="btn-back">Voltar</a>
        </div>
    </form>
</div>

{% endblock %}
